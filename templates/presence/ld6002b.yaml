# @template: ld6002b
# @title: LD6002B 3D mmWave Presence
# @category: presence
# @description: HiLink HLK-LD6002B 60GHz mmWave radar with 3D (X/Y/Z) multi-target tracking over UART. Exposes occupancy, the active target count and the first target's 3D position. Owns its own uart: bus.
# @platforms: esp32, esp32s2, esp32s3, esp32c3, esp32c6
# @requires: none
# @entities: binary_sensor "Presence"; sensor "Target Count"; sensor "Target 1 X"; sensor "Target 1 Y"; sensor "Target 1 Z"
# @var st_name_prefix []: Prefix prepended to every entity name
# @var st_disabled_by_default [false]: Ship the entities disabled in HA
# @var st_internal [false]: Hide the entities from HA/web entirely
# @var st_state_class [measurement]: state_class for the numeric sensors; set "" to opt out of HA long-term statistics
# @var st_ld6002b_uart_tx_pin [(required)]: GPIO wired to the sensor RX pin (ESP TX)
# @var st_ld6002b_uart_rx_pin [(required)]: GPIO wired to the sensor TX pin (ESP RX)
# @note: Requires ESPHome 2026.8.0+ (component added in 2026.8).
# @note: Unlike the 24GHz LD2410/LD2450, the LD6002B is a 60GHz (58-64GHz) radar that reports true 3D target coordinates (X/Y/Z in metres) rather than 1D distance or a 2D plane. It tracks up to 3 targets and supports 4 detection areas plus 4 interference/masking areas; ~6m range, +/-60 deg beam, ~0.4m accuracy. Mount it with the antenna facing the detection area and the pin header along the bottom edge - the reported axes assume that orientation.
# @note: The LD6002B needs a 115200 baud UART (8 data bits, parity NONE, 1 stop bit) with BOTH tx_pin and rx_pin wired. Do not use the ESP's primary/boot UART pins - bootloader chatter on them corrupts the radar's state. ESP32 has 3 hardware UARTs, C3/C6 have 2 - one is usually taken by the logger (UART0).
# @note: This preset keeps it light (presence + count + target 1 position). The component also offers target_2/target_3 X/Y/Z, doppler_index, cluster_id, point_count, per-target and per-area binary sensors, work_mode/ota_version text sensors, and the full config surface (number: hold_delay/z_min/z_max/low_power_sleep_time/area_config, select: sensitivity/trigger_speed/installation_mode/area_id, switch: low_power/point_cloud/target_display, button: apply_area/auto_interference/clear_interference/wake/...). Add those platforms with ld6002b_id: st_ld6002b, or !extend st_ld6002b for wakeup_pin/wakeup_pulse/auto_wake.

# Shared knobs live under substitutions: (not defaults:) so a single
# main-config substitution overrides them across every included template;
# per-include vars: still win for this file alone.
substitutions:
  st_name_prefix: ""
  st_disabled_by_default: "false"
  st_internal: "false"
  st_state_class: measurement

# Dedicated UART for this radar. 115200/8N1 is enforced by the component's
# final validation - it rejects the config outright if the bus differs.
uart:
  - id: st_ld6002b_uart
    tx_pin: ${st_ld6002b_uart_tx_pin}
    rx_pin: ${st_ld6002b_uart_rx_pin}
    baud_rate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1

ld6002b:
  id: st_ld6002b
  uart_id: st_ld6002b_uart

binary_sensor:
  - platform: ld6002b
    ld6002b_id: st_ld6002b
    # "target" is any-target presence; per-slot target_1..3 exist too.
    target:
      id: st_ld6002b_presence
      name: "${st_name_prefix}Presence"
      device_class: occupancy
      disabled_by_default: ${st_disabled_by_default}
      internal: ${st_internal}

sensor:
  - platform: ld6002b
    ld6002b_id: st_ld6002b
    target_count:
      id: st_ld6002b_target_count
      name: "${st_name_prefix}Target Count"
      icon: mdi:account-group
      accuracy_decimals: 0
      state_class: "${st_state_class}"
      disabled_by_default: ${st_disabled_by_default}
      internal: ${st_internal}
    # Slot 1 only - a target keeps its slot while it stays tracked, and new
    # arrivals take the lowest free slot, so target_1 is the "primary" person.
    # The platform already applies a 1s timeout + throttle filter to these
    # streamed values, so no update_interval knob applies (the radar pushes).
    target_1:
      x:
        id: st_ld6002b_target1_x
        name: "${st_name_prefix}Target 1 X"
        device_class: distance
        unit_of_measurement: m
        accuracy_decimals: 2
        state_class: "${st_state_class}"
        disabled_by_default: ${st_disabled_by_default}
        internal: ${st_internal}
      y:
        id: st_ld6002b_target1_y
        name: "${st_name_prefix}Target 1 Y"
        device_class: distance
        unit_of_measurement: m
        accuracy_decimals: 2
        state_class: "${st_state_class}"
        disabled_by_default: ${st_disabled_by_default}
        internal: ${st_internal}
      z:
        id: st_ld6002b_target1_z
        name: "${st_name_prefix}Target 1 Z"
        device_class: distance
        unit_of_measurement: m
        accuracy_decimals: 2
        state_class: "${st_state_class}"
        disabled_by_default: ${st_disabled_by_default}
        internal: ${st_internal}
