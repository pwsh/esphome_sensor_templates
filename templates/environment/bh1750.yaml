# @template: bh1750
# @title: BH1750 Luminance
# @category: environment
# @description: Reads ambient light (illuminance, lux) from a ROHM BH1750 over I2C. Shares the library I2C bus.
# @platforms: esp32, esp32s2, esp32s3, esp32c3, esp32c6
# @requires: i2c
# @entities: sensor "Illuminance"
# @var st_update_interval [60s]: How often to sample the sensor
# @var st_name_prefix []: Prefix prepended to the entity name
# @var st_disabled_by_default [false]: Ship the entity disabled in HA
# @var st_internal [false]: Hide the entity from HA/web entirely
# @var st_state_class [measurement]: state_class for the reading; set "" to opt out of HA long-term statistics
# @var st_bh1750_i2c_id [st_i2c_bus]: id of the I2C bus to use (from core/i2c.yaml)
# @var st_bh1750_address [0x23] {0x23|0x5C}: I2C address (0x23 ADDR->GND/floating, 0x5C ADDR->VCC)
# @note: Requires the shared I2C bus - include core/i2c.yaml. The component picks measurement resolution automatically based on light level.
# @note: Common breakout is the GY-302. Range roughly 1-65535 lx; direct sunlight saturates the high end.

# Shared knobs live under substitutions: (not defaults:) so a single
# main-config substitution overrides them across every included template;
# per-include vars: still win for this file alone.
substitutions:
  st_update_interval: 60s
  st_name_prefix: ""
  st_disabled_by_default: "false"
  st_internal: "false"
  st_state_class: measurement

defaults:
  st_bh1750_i2c_id: st_i2c_bus
  st_bh1750_address: "0x23"

sensor:
  - platform: bh1750
    id: st_bh1750_illuminance
    name: "${st_name_prefix}Illuminance"
    i2c_id: ${st_bh1750_i2c_id}
    address: ${st_bh1750_address}
    update_interval: ${st_update_interval}
    device_class: illuminance
    unit_of_measurement: lx
    accuracy_decimals: 1
    state_class: "${st_state_class}"
    disabled_by_default: ${st_disabled_by_default}
    internal: ${st_internal}
    icon: mdi:brightness-5
